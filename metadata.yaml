description: >
  Photographic records annex — downloads the photos attached to EarthRanger
  events for a chosen period (optionally filtered by event type and state)
  and presents one row per photo: event ID, date and time, classification,
  coordinates and the image. Produces an interactive dashboard and a Word
  (.docx) annex, ready to attach to partner reports.
