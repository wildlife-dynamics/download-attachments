    time_range:
      since: "2026-06-01T03:00:00.000Z"
      until: "2026-07-01T03:00:00.000Z"
      timezone:
        label: "UTC-03:00"
        tzCode: America/Sao_Paulo
        name: America/Sao_Paulo
        utc: "-03:00"
    report_language:
      var: en
    oldest_first:
      var: true
    include_details:
      var: false
    photo_records_report:
      filename: photo_records_annex
      template_path: "file:///workspace/resources/templates/photo_records_annex_template.docx"
    events:
      event_types: []
    download_photos:
      photo_size: xlarge
